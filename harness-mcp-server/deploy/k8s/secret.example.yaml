# EXAMPLE ONLY -- do not apply this file as-is, and never commit real values.
# In production, use External Secrets Operator (or equivalent) to sync these
# keys from Vault/AWS Secrets Manager into a real Secret named
# harness-mcp-server-secrets. The values below document which keys the
# Deployment expects; they hold no Harness user tokens (those come per-
# request via x-harness-api-key in HTTP mode) -- only the server's own
# operational config that is org-identifying but not itself a credential.
apiVersion: v1
kind: Secret
metadata:
  name: harness-mcp-server-secrets
  namespace: harness-mcp
type: Opaque
stringData:
  HARNESS_ACCOUNT_ID: "<your-harness-account-id>"
  HARNESS_ORG_ID: "<your-harness-org-id>"
  HARNESS_PROJECT_ID: "<your-harness-project-id>"
  VAULT_ADDR: "https://vault.internal.example.com:8200"
  VAULT_ROLE: "harness-mcp-server"
  REDIS_URL: "rediss://redis.internal.example.com:6379/0"
  AUDIT_S3_BUCKET: "<your-org>-harness-mcp-audit-log"
  AUDIT_S3_REGION: "us-east-1"
  AUDIT_WEBHOOK_URL: "https://siem.internal.example.com/hooks/harness-mcp"
  AUDIT_WEBHOOK_SIGNING_SECRET_REF: "harness-mcp-server/audit-webhook-signing-secret"
