# Dedicated ServiceAccount -- never `default`. Bind this to a least-privilege
# IAM role (IRSA, if SECRETS_BACKEND=aws-secrets-manager and/or the S3
# Object Lock audit sink is used) or rely on Vault's Kubernetes auth method
# (VAULT_AUTH_METHOD=kubernetes), which uses this SA's projected token and
# needs no extra annotation here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harness-mcp-server
  namespace: harness-mcp
  annotations:
    # Example only -- replace with your account's actual IRSA role ARN, or
    # remove this annotation entirely if using Vault's Kubernetes auth method
    # instead of AWS Secrets Manager.
    eks.amazonaws.com/role-arn: "arn:aws:iam::<ACCOUNT_ID>:role/<harness-mcp-server-role>"
automountServiceAccountToken: true
