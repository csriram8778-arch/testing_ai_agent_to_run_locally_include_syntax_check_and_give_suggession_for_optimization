apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: harness-mcp-server
  namespace: harness-mcp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: harness-mcp-server
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
